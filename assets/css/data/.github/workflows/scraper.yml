name: GlitchRadar Hourly Scraper

on:
  schedule:
    - cron: '0 * * * *'  # Läuft jede volle Stunde
  workflow_dispatch:      # Ermöglicht auch den manuellen Start im GitHub-Menü

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scraper ausführen
        run: python scraper.py

      - name: Änderungen speichern (Git Commit & Push)
        run: |
          git config --global user.name "GlitchRadar Bot"
          git config --global user.email "bot@glitchradar.local"
          git add data/products.json
          git diff --staged --quiet || git commit -m "Auto: Update product anomalies [skip ci]"
          git push
