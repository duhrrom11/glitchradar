name: GlitchRadar Automated Scraper

on:
  schedule:
    - cron: '0 * * * *'  # Läuft stündlich zur vollen Stunde
  workflow_dispatch:      # Ermöglicht den manuellen Start über den GitHub Actions Tab

permissions:
  contents: write        # Erlaubt dem Bot das Speichern der JSON-Dateien

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Main Scraper & Price Checker
        run: python scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

      - name: Commit and Push Results
        run: |
          git config --global user.name "GlitchRadar Bot"
          git config --global user.email "bot@users.noreply.github.com"
          mkdir -p data
          [ -f data/products.json ] || echo "[]" > data/products.json
          [ -f data/users.json ] || echo "[]" > data/users.json
          git add data/products.json data/users.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update deals and users [skip ci]" && git push)
          
